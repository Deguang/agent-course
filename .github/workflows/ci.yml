name: CI

on:
  push:
  pull_request:

# 注:章节测试(npm test)是学习者的本地反馈,起始状态故意为红(答案扣住),
# 不在 CI 里门禁。CI 只校验脚手架健康:类型 + lint/format。
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
