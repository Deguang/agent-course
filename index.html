<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>动手学 Agent</title>
<style>
  :root { --bg:#faf9f6; --fg:#1f2328; --muted:#6a737d; --accent:#c9622e; --line:#e5e2db; --card:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16181c; --fg:#e6e6e6; --muted:#9aa0a6; --accent:#e08a5a; --line:#2c2f36; --card:#1e2126; } }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--fg); background:var(--bg); }
  .wrap { display:grid; grid-template-columns:248px minmax(0,1fr); min-height:100vh; }
  aside { border-right:1px solid var(--line); padding:24px 16px; position:sticky; top:0; align-self:start; max-height:100vh; overflow-y:auto; display:flex; flex-direction:column; }
  aside h1 { font-size:15px; margin:0 0 4px; }
  aside .sub { color:var(--muted); font-size:12px; margin-bottom:18px; }
  nav .group { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em; margin:16px 10px 4px; }
  nav a { display:block; padding:7px 10px; border-radius:8px; color:var(--fg); text-decoration:none; font-size:14px; }
  nav a:hover { background:color-mix(in srgb, var(--fg) 6%, transparent); }
  nav a.active { background:color-mix(in srgb, var(--accent) 15%, transparent); color:var(--accent); font-weight:600; }
  nav a .n { color:var(--muted); font-variant-numeric:tabular-nums; margin-right:8px; }
  nav a.active .n { color:var(--accent); }
  aside .lic { margin-top:auto; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:11.5px; line-height:1.6; }
  aside .lic a { color:var(--muted); }
  /* 居中阅读列,两侧留白平衡 */
  main { padding:40px 40px; margin:0 auto; max-width:880px; width:100%; }
  h2 { margin:0 0 4px; }
  .meta { color:var(--muted); font-size:12.5px; margin:0 0 18px; display:flex; gap:10px 14px; flex-wrap:wrap; align-items:center; }
  .meta .tag { border:1px solid var(--line); border-radius:999px; padding:2px 10px; }
  .hook { font-size:16.5px; margin:0 0 18px; }
  .hook.loading { color:var(--muted); font-size:14px; }
  code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.88em; background:color-mix(in srgb, var(--fg) 7%, transparent); padding:1px 5px; border-radius:5px; }
  pre { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; overflow-x:auto; font-size:13px; }
  pre code { background:none; padding:0; }
  .predict { border-left:3px solid var(--accent); background:var(--card); padding:10px 16px; border-radius:0 8px 8px 0; margin:18px 0; font-size:14px; }
  .gate { border:1px dashed var(--accent); border-radius:10px; padding:16px 18px; margin:18px 0; }
  .gate > summary { cursor:pointer; font-weight:600; color:var(--accent); list-style:none; }
  .gate > summary::before { content:"▸ "; }
  .gate[open] > summary::before { content:"▾ "; }
  .gate[open] > summary { margin-bottom:12px; }
  footer { color:var(--muted); font-size:12px; margin-top:44px; border-top:1px solid var(--line); padding-top:16px; }
  /* 渲染出来的 README 正文 */
  .readme > :first-child { margin-top:0; }
  .readme h1 { font-size:1.5em; } .readme h2 { font-size:1.25em; margin-top:1.6em; }
  .readme h3 { font-size:1.08em; margin-top:1.4em; }
  .readme h1, .readme h2 { border-bottom:1px solid var(--line); padding-bottom:.3em; }
  .readme table { border-collapse:collapse; display:block; overflow-x:auto; max-width:100%; font-size:14px; margin:16px 0; }
  .readme th, .readme td { border:1px solid var(--line); padding:6px 12px; text-align:left; }
  .readme th { background:color-mix(in srgb, var(--fg) 5%, transparent); }
  .readme blockquote { margin:16px 0; padding:6px 16px; border-left:3px solid var(--accent); color:var(--muted); background:var(--card); border-radius:0 8px 8px 0; }
  .readme blockquote > :first-child { margin-top:0; } .readme blockquote > :last-child { margin-bottom:0; }
  .readme a { color:var(--accent); }
  .readme hr { border:none; border-top:1px solid var(--line); margin:28px 0; }
  .readme img { max-width:100%; }
  .loading { color:var(--muted); font-size:14px; }
  @media (max-width:720px) {
    .wrap { grid-template-columns:1fr; }
    aside { position:static; max-height:none; border-right:none; border-bottom:1px solid var(--line); }
    main { padding:28px 20px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <aside>
    <h1>动手学 Agent</h1>
    <div class="sub">provider 中立 · TS · 习得导向</div>
    <nav id="nav"></nav>
    <div class="lic">
      <strong>许可</strong><br>
      代码 <a href="LICENSE">MIT</a> · 内容 <a href="LICENSE-CONTENT">CC BY-NC 4.0</a><br>
      © 2026 Deguang
    </div>
  </aside>
  <main id="main"></main>
</div>

<script src="assets/marked.min.js"></script>
<script>
// 单一真源:站点只提供「导航 · 预测闸门 · license」;所有教学内容都来自 chapters/NN/README.md,
// fetch 后渲染 —— 页面不硬编码任何一句正文(钩子也从 README 首段自动提取)。防漂移。
// CH 只存导航元数据(标题/分组/演进格/测试数),不是内容。
const CH = [
  { n:"00", group:"定向",          title:"基础全景:模型、工具、循环", stage:"全景 raw→graph" },
  { n:"01", group:"主线 · loop",    title:"agent 的心脏:一个 loop",   stage:"loop 诞生",      file:"agent.ts",      tests:5 },
  { n:"02", group:"主线 · loop",    title:"接真实模型 & 可靠输出",     stage:"raw → harness",  file:"adapter.ts",    tests:9 },
  { n:"03", group:"给 loop 长手脚", title:"常用工具集",                stage:"loop + 真实工具",file:"tools.ts",      tests:12 },
  { n:"04", group:"给 loop 长手脚", title:"有状态 & 持久化",           stage:"loop 长期运行",  file:"session.ts",    tests:8 },
  { n:"05", group:"给 loop 长手脚", title:"上下文管理",                stage:"喂得进窗口",     file:"context.ts",    tests:5 },
  { n:"06", group:"给 loop 长手脚", title:"可扩展性:MCP · Skills",     stage:"能力可插拔",     file:"extensions.ts", tests:4 },
  { n:"07", group:"主线 · graph",   title:"编排与多 agent",            stage:"loop → graph",   file:"graph.ts",      tests:8 },
  { n:"08", group:"补齐主流栈",     title:"知识层:RAG / 检索",         stage:"知识层",         file:"rag.ts",        tests:6 },
  { n:"09", group:"补齐主流栈",     title:"Guardrails & 人在环路",     stage:"治理竖轨",       file:"guardrails.ts", tests:8 },
  { n:"10", group:"补齐主流栈",     title:"Evals & 可观测",            stage:"观测竖轨",       file:"eval.ts",       tests:6 },
  { n:"11", group:"补齐主流栈",     title:"上生产:LLMOps & 服务化",    stage:"部署层",         file:"prod.ts",       tests:8 },
  { n:"12", group:"综合",          title:"Capstone:独立做产品",       stage:"综合 · 全栈" },
];

if (window.marked) marked.setOptions({ gfm:true, breaks:false });

// 从 README 抽首段当钩子(目标 blockquote 或第一段正文),不硬编码。
function firstBlock(md){
  const lines = md.replace(/\r/g,"").split("\n");
  let i = 0;
  while (i < lines.length && !lines[i].trim()) i++;
  if (/^#{1,6}\s/.test(lines[i] || "")) i++;         // 跳过 H1
  while (i < lines.length && !lines[i].trim()) i++;   // 跳过空行
  const buf = [];
  while (i < lines.length && lines[i].trim()) { buf.push(lines[i]); i++; }
  return buf.join(" ").replace(/^>\s?/, "").replace(/^\s*目标[:：]\s*/, "").replace(/\s*>\s*/g, " ").trim();
}

// 每章 README 只 fetch 一次
const cache = {};
async function loadMd(n){
  if (cache[n]) return cache[n];
  const res = await fetch(`chapters/${n}/README.md`);
  if (!res.ok) throw new Error("HTTP " + res.status);
  return (cache[n] = await res.text());
}
const fetchHint = n => `<span class="loading">正文来自 <code>chapters/${n}/README.md</code>。若用 <code>file://</code> 本地打开,fetch 会被浏览器 CORS 拦截——请用部署站点或本地服务器(<code>npx serve</code>)。</span>`;

function chapterHTML(c){
  const meta = [`<span class="tag">演进 · ${c.stage}</span>`];
  if (c.tests) meta.push(`<span class="tag">${c.tests} 个测试</span>`);
  if (c.file)  meta.push(`动手 <code>chapters/${c.n}/${c.file}</code>`);
  return `<section class="chapter" id="${c.n}" hidden>
    <h2>Chapter ${c.n} · ${c.title}</h2>
    <p class="meta">${meta.join("")}</p>
    <p class="hook loading" data-n="${c.n}">…</p>
    <div class="predict">动手前先在根目录 <code>JOURNAL.md</code> 写下你的预测,再展开正文——<strong>先押注,才学得到</strong>。(demo/命令、练习、讲回来都在正文里)</div>
    <details class="gate">
      <summary>我已写下预测,展开本章正文</summary>
      <div class="readme" data-src="chapters/${c.n}/README.md"><p class="loading">展开即载入…</p></div>
    </details>
    <footer>本页只做<strong>导航 · 预测闸门</strong>;正文单一真源,直接渲染自 <code>chapters/${c.n}/README.md</code>。真正的习得,是你能不看着从空白重推。</footer>
  </section>`;
}

const groups = [];
document.getElementById("nav").innerHTML = CH.map(c => {
  let g = "";
  if (!groups.includes(c.group)) { groups.push(c.group); g = `<div class="group">${c.group}</div>`; }
  return `${g}<a href="#${c.n}" data-n="${c.n}"><span class="n">${c.n}</span>${c.title}</a>`;
}).join("");
document.getElementById("main").innerHTML = CH.map(chapterHTML).join("");

// 钩子:章节可见时懒填(从 README 首段提取)
function fillHook(n){
  const el = document.querySelector(`.hook[data-n="${n}"]`);
  if (!el || el.dataset.loaded) return;
  el.dataset.loaded = "1";
  loadMd(n)
    .then(md => { el.classList.remove("loading"); el.innerHTML = window.marked ? marked.parseInline(firstBlock(md)) : firstBlock(md); })
    .catch(() => { el.dataset.loaded = ""; el.innerHTML = fetchHint(n); });
}

// 闸门:首次展开渲染整篇 README
document.querySelectorAll("details.gate").forEach(d => {
  d.addEventListener("toggle", async () => {
    if (!d.open) return;
    const host = d.querySelector(".readme");
    if (!host || host.dataset.loaded) return;
    host.dataset.loaded = "1";
    try {
      const md = await loadMd(host.dataset.src.match(/chapters\/(\d\d)\//)[1]);
      host.innerHTML = window.marked ? marked.parse(md) : `<pre>${md.replace(/</g, "&lt;")}</pre>`;
    } catch (e) {
      host.dataset.loaded = "";
      host.innerHTML = `<p class="loading">无法载入(${e.message})。</p>` + fetchHint(host.dataset.src.match(/(\d\d)/)[1]);
    }
  });
});

// hash 路由
const ids = CH.map(c => c.n);
const links = [...document.querySelectorAll("nav a[data-n]")];
function route(){
  let n = location.hash.replace("#", "");
  if (!ids.includes(n)) n = "00";
  document.querySelectorAll(".chapter").forEach(s => { s.hidden = s.id !== n; });
  links.forEach(a => a.classList.toggle("active", a.dataset.n === n));
  window.scrollTo(0, 0);
  fillHook(n);
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
