<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>动手学 Agent</title>
<script>
  // 提前应用主题,避免刷新闪白/闪暗
  try { document.documentElement.setAttribute("data-theme", localStorage.getItem("ac-theme") || "system"); } catch (e) {}
</script>
<!-- 仓耳今楷 web 字体(unicode-range 分片 woff2,按需下载;字体名 TsangerJinKai02 已在 --font-fallback 首位)。
     字体文件走阿里 CDN;取不到会优雅降级回系统楷体 STKaiti/KaiTi。CSS 自托管,源自 https://weekly.tw93.fun/fonts/jinkai.css -->
<link rel="preconnect" href="https://gw.alipayobjects.com" crossorigin />
<link rel="stylesheet" href="assets/jinkai.css" />
<style>
  :root {
    /* 颜色(纯亮色) */
    --bg:#faf9f6; --fg:#1f2328; --muted:#6a737d; --accent:#c9622e; --line:#e5e2db; --card:#fff;
    color-scheme: light;
    /* 字体 */
    --font-fallback: "TsangerJinKai02", "STKaiti", "KaiTi", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
    --font-body: var(--font-fallback);
    --font-mono: "SF Mono", Consolas, Monaco, "Courier New", Courier, monospace;
    --font-size-base: 16px;
    --font-size-small: 14px;
    --line-height-normal: 1.7;
    --line-height-tight: 1.6;
    /* 尺度 */
    --theme-navbar-height: 96px;
    --radius: 8px;
    --transition-base: .2s ease;
    --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-8:32px;
  }
  /* 暗色:显式选 dark,或「跟随系统」且系统偏好暗 */
  :root[data-theme="dark"] { --bg:#16181c; --fg:#e6e6e6; --muted:#9aa0a6; --accent:#e08a5a; --line:#2c2f36; --card:#1e2126; color-scheme:dark; }
  @media (prefers-color-scheme: dark) {
    :root[data-theme="system"] { --bg:#16181c; --fg:#e6e6e6; --muted:#9aa0a6; --accent:#e08a5a; --line:#2c2f36; --card:#1e2126; color-scheme:dark; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:var(--font-size-base)/var(--line-height-normal) var(--font-body); color:var(--fg); background:var(--bg); }
  .wrap { display:grid; grid-template-columns:300px minmax(0,1fr); min-height:100vh; }

  /* 侧栏:全高,顶部品牌 / 中间可滚导航 / 底部许可 */
  aside { border-right:1px solid var(--line); position:sticky; top:0; height:100vh; overflow:hidden; display:flex; flex-direction:column; }
  aside .brand { flex:0 0 auto; min-height:var(--theme-navbar-height); padding:var(--space-6) var(--space-5) var(--space-4); display:flex; flex-direction:column; justify-content:center; border-bottom:1px solid var(--line); }
  aside .brand h1 { font-size:17px; margin:0 0 var(--space-1); }
  aside .brand .sub { color:var(--muted); font-size:13px; }
  nav { flex:1 1 auto; overflow-y:auto; padding:var(--space-3) var(--space-3); }
  nav .group { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em; margin:var(--space-4) 10px var(--space-1); }
  nav a { display:block; padding:9px 12px; border-radius:var(--radius); color:var(--fg); text-decoration:none; font-size:15px; transition:background var(--transition-base), color var(--transition-base); }
  nav a:hover { background:color-mix(in srgb, var(--fg) 6%, transparent); }
  nav a.active { background:color-mix(in srgb, var(--accent) 15%, transparent); color:var(--accent); font-weight:600; }
  nav a .n { color:var(--muted); font-variant-numeric:tabular-nums; margin-right:var(--space-2); }
  nav a.active .n { color:var(--accent); }
  aside .theme { flex:0 0 auto; display:flex; gap:var(--space-1); padding:var(--space-3) var(--space-5) 0; }
  aside .theme button { flex:1; display:flex; align-items:center; justify-content:center; gap:5px; font-family:inherit; font-size:12px; padding:6px 4px; border:1px solid var(--line); background:transparent; color:var(--muted); border-radius:var(--radius); cursor:pointer; transition:all var(--transition-base); }
  aside .theme button svg { width:15px; height:15px; flex:0 0 auto; }
  aside .theme button:hover { color:var(--fg); }
  aside .theme button.active { border-color:var(--accent); color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, transparent); font-weight:600; }
  aside .lic { flex:0 0 auto; padding:var(--space-4) var(--space-5); border-top:1px solid var(--line); color:var(--muted); font-size:12px; line-height:var(--line-height-tight); margin-top:var(--space-3); }
  aside .lic a { color:var(--muted); }

  /* 居中阅读列,字号放大 */
  main { padding:var(--space-8) var(--space-6); margin:0 auto; max-width:900px; width:100%; font-size:17px; }
  h2 { margin:0 0 var(--space-1); font-size:1.55em; }
  .meta { color:var(--muted); font-size:var(--font-size-small); margin:0 0 var(--space-5); display:flex; gap:10px 14px; flex-wrap:wrap; align-items:center; }
  .meta .tag { border:1px solid var(--line); border-radius:999px; padding:2px 10px; }
  code { font-family:var(--font-mono); font-size:.9em; background:color-mix(in srgb, var(--fg) 7%, transparent); padding:1px 5px; border-radius:5px; }
  pre { font-family:var(--font-mono); background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:var(--space-3) var(--space-4); overflow-x:auto; font-size:14px; }
  pre code { background:none; padding:0; }
  footer { color:var(--muted); font-size:13px; margin-top:var(--space-8); border-top:1px solid var(--line); padding-top:var(--space-4); }

  /* 渲染出来的 README 正文 */
  .readme { line-height:var(--line-height-normal); }
  .readme > :first-child { margin-top:0; }
  .readme h1 { font-size:1.5em; } .readme h2 { font-size:1.28em; margin-top:1.6em; }
  .readme h3 { font-size:1.1em; margin-top:1.4em; }
  .readme h1, .readme h2 { border-bottom:1px solid var(--line); padding-bottom:.3em; }
  .readme table { border-collapse:collapse; display:block; overflow-x:auto; max-width:100%; font-size:15px; margin:var(--space-4) 0; }
  .readme th, .readme td { border:1px solid var(--line); padding:6px 12px; text-align:left; }
  .readme th { background:color-mix(in srgb, var(--fg) 5%, transparent); }
  .readme blockquote { margin:var(--space-4) 0; padding:6px 16px; border-left:3px solid var(--accent); color:var(--muted); background:var(--card); border-radius:0 var(--radius) var(--radius) 0; }
  .readme blockquote > :first-child { margin-top:0; } .readme blockquote > :last-child { margin-bottom:0; }
  .readme a { color:var(--accent); }
  .readme hr { border:none; border-top:1px solid var(--line); margin:28px 0; }
  .readme img { max-width:100%; }
  .loading { color:var(--muted); font-size:var(--font-size-small); }

  @media (max-width:720px) {
    .wrap { grid-template-columns:1fr; }
    aside { position:static; height:auto; overflow:visible; border-right:none; border-bottom:1px solid var(--line); }
    nav { max-height:none; }
    main { padding:var(--space-6) var(--space-5); }
  }
</style>
</head>
<body>
<div class="wrap">
  <aside>
    <div class="brand">
      <h1>动手学 Agent</h1>
      <div class="sub">provider 中立 · TS · 习得导向</div>
    </div>
    <nav id="nav"></nav>
    <div class="theme" id="theme">
      <button data-mode="light" title="亮色" aria-label="亮色">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>亮</button>
      <button data-mode="dark" title="暗色" aria-label="暗色">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>暗</button>
      <button data-mode="system" title="跟随系统" aria-label="跟随系统">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>跟随</button>
    </div>
    <div class="lic">
      <strong>许可</strong><br>
      代码 <a href="LICENSE">MIT</a> · 内容 <a href="LICENSE-CONTENT">CC BY-NC 4.0</a><br>
      © 2026 Deguang
    </div>
  </aside>
  <main id="main"></main>
</div>

<script src="assets/marked.min.js"></script>
<script>
// 单一真源:站点只提供「导航 · license」;所有教学内容都来自 chapters/NN/README.md,fetch 后直接渲染。
// 页面不硬编码任何一句正文。CH 只存导航元数据(标题/分组/演进格/测试数)。
const CH = [
  { n:"00", group:"定向",          title:"基础全景:模型、工具、循环", stage:"全景 raw→graph" },
  { n:"01", group:"主线 · loop",    title:"agent 的心脏:一个 loop",   stage:"loop 诞生",      file:"agent.ts",      tests:5 },
  { n:"02", group:"主线 · loop",    title:"接真实模型 & 可靠输出",     stage:"raw → harness",  file:"adapter.ts",    tests:9 },
  { n:"03", group:"给 loop 长手脚", title:"常用工具集",                stage:"loop + 真实工具",file:"tools.ts",      tests:12 },
  { n:"04", group:"给 loop 长手脚", title:"有状态 & 持久化",           stage:"loop 长期运行",  file:"session.ts",    tests:8 },
  { n:"05", group:"给 loop 长手脚", title:"上下文管理",                stage:"喂得进窗口",     file:"context.ts",    tests:5 },
  { n:"06", group:"给 loop 长手脚", title:"可扩展性:MCP · Skills",     stage:"能力可插拔",     file:"extensions.ts", tests:4 },
  { n:"07", group:"主线 · graph",   title:"编排与多 agent",            stage:"loop → graph",   file:"graph.ts",      tests:8 },
  { n:"08", group:"补齐主流栈",     title:"知识层:RAG / 检索",         stage:"知识层",         file:"rag.ts",        tests:6 },
  { n:"09", group:"补齐主流栈",     title:"Guardrails & 人在环路",     stage:"治理竖轨",       file:"guardrails.ts", tests:8 },
  { n:"10", group:"补齐主流栈",     title:"Evals & 可观测",            stage:"观测竖轨",       file:"eval.ts",       tests:6 },
  { n:"11", group:"补齐主流栈",     title:"上生产:LLMOps & 服务化",    stage:"部署层",         file:"prod.ts",       tests:8 },
  { n:"12", group:"综合",          title:"Capstone:独立做产品",       stage:"综合 · 全栈" },
];

if (window.marked) marked.setOptions({ gfm:true, breaks:false });

// 主题切换:亮 / 暗 / 跟随系统(data-theme 已在 <head> 提前应用)
function applyTheme(mode){
  document.documentElement.setAttribute("data-theme", mode);
  try { localStorage.setItem("ac-theme", mode); } catch (e) {}
  document.querySelectorAll("#theme button").forEach(b => b.classList.toggle("active", b.dataset.mode === mode));
}
applyTheme(localStorage.getItem("ac-theme") || "system");
document.querySelectorAll("#theme button").forEach(b => b.addEventListener("click", () => applyTheme(b.dataset.mode)));

// README 里的相对链接是相对"文件在仓库里的位置"写的;页面渲染在别的路径上,直接点会解析错。
// 解析成 GitHub 仓库地址。baseDir 如 "chapters/01/"。
const REPO = "https://github.com/Deguang/agent-course";
function resolvePath(baseDir, href){
  const out = [];
  for (const part of (baseDir + href).split("/")) {
    if (part === "" || part === ".") continue;
    if (part === "..") out.pop();
    else out.push(part);
  }
  return out.join("/");
}
function rewriteLinks(host, n){
  host.querySelectorAll("a[href]").forEach(a => {
    const raw = a.getAttribute("href") || "";
    if (raw.startsWith("#")) return;                                  // 页内锚点,留着
    if (/^([a-z][a-z0-9+.-]*:)?\/\//i.test(raw) || /^mailto:/i.test(raw)) { // 已是绝对/外链
      a.target = "_blank"; a.rel = "noopener"; return;
    }
    const cut = raw.search(/[#?]/);
    const path = cut === -1 ? raw : raw.slice(0, cut);
    const tail = cut === -1 ? "" : raw.slice(cut);
    const resolved = resolvePath(`chapters/${n}/`, path);
    const isFile = /\.[a-z0-9]+$/i.test(resolved.split("/").pop() || "");
    a.href = `${REPO}/${isFile ? "blob" : "tree"}/main/${resolved}${tail}`;
    a.target = "_blank"; a.rel = "noopener";
  });
}

// 每章 README 只 fetch 一次
const cache = {};
async function loadMd(n){
  if (cache[n]) return cache[n];
  const res = await fetch(`chapters/${n}/README.md`);
  if (!res.ok) throw new Error("HTTP " + res.status);
  return (cache[n] = await res.text());
}

function chapterHTML(c){
  const meta = [`<span class="tag">演进 · ${c.stage}</span>`];
  if (c.tests) meta.push(`<span class="tag">${c.tests} 个测试</span>`);
  if (c.file)  meta.push(`动手 <code>chapters/${c.n}/${c.file}</code>`);
  return `<section class="chapter" id="${c.n}" hidden>
    <h2>Chapter ${c.n} · ${c.title}</h2>
    <p class="meta">${meta.join("")}</p>
    <div class="readme" data-n="${c.n}"><p class="loading">载入正文…</p></div>
    <footer>正文单一真源,直接渲染自 <code>chapters/${c.n}/README.md</code>。真正的习得,是你能不看着从空白重推 <code>${c.file || "它"}</code>。</footer>
  </section>`;
}

const groups = [];
document.getElementById("nav").innerHTML = CH.map(c => {
  let g = "";
  if (!groups.includes(c.group)) { groups.push(c.group); g = `<div class="group">${c.group}</div>`; }
  return `${g}<a href="#${c.n}" data-n="${c.n}"><span class="n">${c.n}</span>${c.title}</a>`;
}).join("");
document.getElementById("main").innerHTML = CH.map(chapterHTML).join("");

// 章节可见时渲染整篇 README(懒加载 + 缓存)
function render(n){
  const host = document.querySelector(`.readme[data-n="${n}"]`);
  if (!host || host.dataset.loaded) return;
  host.dataset.loaded = "1";
  loadMd(n)
    .then(md => {
      if (window.marked) {
        host.innerHTML = marked.parse(md);
        host.querySelector("h1")?.remove(); // README 的 H1 = 章标题,与上方站点标题重复,去掉
        rewriteLinks(host, n);              // 相对链接 → 指向 GitHub 仓库文件
      } else {
        host.innerHTML = `<pre>${md.replace(/</g,"&lt;")}</pre>`;
      }
    })
    .catch(e => {
      host.dataset.loaded = "";
      host.innerHTML = `<p class="loading">无法载入 <code>chapters/${n}/README.md</code>(${e.message})。`
        + `若用 <code>file://</code> 本地打开,fetch 会被浏览器 CORS 拦截——请用部署站点或本地服务器(<code>npx serve</code>)。</p>`;
    });
}

// hash 路由
const ids = CH.map(c => c.n);
const links = [...document.querySelectorAll("nav a[data-n]")];
function route(){
  let n = location.hash.replace("#", "");
  if (!ids.includes(n)) n = "00";
  document.querySelectorAll(".chapter").forEach(s => { s.hidden = s.id !== n; });
  links.forEach(a => a.classList.toggle("active", a.dataset.n === n));
  window.scrollTo(0, 0);
  render(n);
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
